version: "2"
run:
  modules-download-mode: readonly
linters:
  default: all
  disable:
    - asasalint
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dupl
    - err113
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godox
    - importas
    - interfacebloat
    - ireturn
    - maintidx
    - makezero
    - mnd
    - musttag
    - nestif
    - nilnil
    - nlreturn
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - prealloc
    - revive
    - tagliatelle
    - testpackage
    - unconvert
    - varnamelen
    - wrapcheck
    - wsl
    # Newer defaults not enforced by the previous v1 config.
    - funcorder
    - godoclint
    - noinlineerr
  settings:
    govet:
      disable:
        - fieldalignment
        - shadow
        - composites
      enable-all: true
    lll:
      line-length: 140
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupword
          - exhaustive
          - goconst
          - gosec
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
